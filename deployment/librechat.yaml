version: 1.3.13
cache: false

interface:
  fileSearch: false

endpoints:
  custom:
    - name: 'Grok'
      apiKey: 'user_provided'
      baseURL: 'https://api.x.ai/v1'
      models:
        # Required by LibreChat's endpoint schema. The server hides this fallback
        # until a user key successfully returns models from xAI's /models endpoint.
        default:
          - 'grok-3'
        fetch: true
      titleConvo: true
      titleModel: 'current_model'
      modelDisplayLabel: 'Grok'
