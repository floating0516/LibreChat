name: librechat-local

services:
  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command:
      - mongod
      - --bind_ip
      - 127.0.0.1
      - --auth
    volumes:
      - ./runtime/mongo:/data/db
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --username \"$${MONGO_ROOT_USER}\" --password \"$${MONGO_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: ${LIBRECHAT_IMAGE}
    restart: unless-stopped
    network_mode: host
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOST: 127.0.0.1
      PORT: "3080"
      NODE_ENV: production
      APP_TITLE: ${APP_TITLE:-ToCreate}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@127.0.0.1:27017/LibreChat?authSource=admin
    volumes:
      - ./deployment/librechat.yaml:/app/librechat.yaml:ro
      - ./runtime/uploads:/app/uploads
      - ./runtime/logs:/app/logs
    mem_limit: 1200m
    cpus: 1.25
    pids_limit: 512
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3080/readyz | grep -qx OK"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  admin-panel:
    image: ${ADMIN_PANEL_IMAGE}
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      API_SERVER_URL: http://127.0.0.1:3080
      VITE_API_BASE_URL: http://localhost:3080
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - ./deployment/admin-panel-server.ts:/app/server.ts:ro
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 256
    init: true
    security_opt:
      - no-new-privileges:true
